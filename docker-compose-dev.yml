services:
  app:
    image: ghcr.io/seanpoke/liunian-account-backend:latest
    container_name: liunian-account-backend-dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8666}:${SERVER_PORT:-8666}"
    env_file:
      - ./ci/.env
    environment:
      SERVER_PORT: "${SERVER_PORT:-8666}"
      TZ: Asia/Shanghai
      APP_TIME_ZONE: Asia/Shanghai
      UPLOAD_DIR: /app/data/upload
      # 对外访问基地址：小程序访问图片需要完整 URL，按实际域名/端口填写
      # APP_PUBLIC_BASE_URL: https://your-domain.com
      MYSQL_HOST: mysql8-container
      MYSQL_PORT: 3306
      REDIS_HOST: redis_container
      REDIS_PORT: 6379
    volumes:
      - app-data:/app/data
    networks:
      - mysql_default
      - redis_default
    # 镜像内已改为跟随 SERVER_PORT 做健康检查；这里显式覆盖是为了兼容
    # 仍在跑的旧镜像（其 HEALTHCHECK 写死 8445）。镜像重新构建发布后可删除。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${SERVER_PORT:-8666}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mysql_default:
    external: true
  redis_default:
    external: true

volumes:
  app-data: