# 流年小账后端 · 仅编排应用本身
# MySQL / Redis 已独立存在（各自容器、各自默认网络），这里让 app 加入它们已有的网络，用容器名访问。

services:
  app:
    image: ghcr.io/seanpoke/liunian-account-backend:latest
    # 本地构建替代方案（取消注释、并注释掉上面的 image 行）：
    # build: .
    container_name: liunian-account-backend
    restart: unless-stopped
    ports:
      - "8445:8445"
    env_file:
      - ./ci/.env
    environment:
      SERVER_PORT: 8445
      # ⚠️ 数据库由 ci/.env 的 MYSQL_DB 决定；应用启动时会校验实际库名。
      #    本文件用于服务器部署：生产环境必须显式设置
      #      MYSQL_DB=liunian_account
      #      DB_ALLOW_PROD=true
      #    开发/测试请使用 liunian_account_dev 且保持 DB_ALLOW_PROD=false。
      # MYSQL_DB: liunian_account
      # DB_ALLOW_PROD: "true"
      # 时区：容器与应用统一 Asia/Shanghai
      TZ: Asia/Shanghai
      APP_TIME_ZONE: Asia/Shanghai
      # 图片落盘目录（容器内路径），配合下方 app-data 数据卷持久化，重启/重建不丢
      UPLOAD_DIR: /app/data/upload
      # 对外访问基地址：小程序访问图片需要完整 URL，按实际域名/端口填写
      # APP_PUBLIC_BASE_URL: https://your-domain.com
      # 通过宿主机已有的容器网络访问 MySQL / Redis（覆盖 ci/.env 里的远程 IP）
      # 容器间通信用容器内端口 3306 / 6379，不是宿主机发布端口 53306 / 6479
      MYSQL_HOST: mysql8-container
      MYSQL_PORT: 3306
      REDIS_HOST: redis_container
      REDIS_PORT: 6379
    volumes:
      # 上传图片持久化：容器重建后图片不丢失。
      # 用「命名卷」而不是 ./data 绑定挂载：容器内以非 root 的 appuser 运行，
      # 绑定挂载在 Linux 上会由 root 创建目录，导致应用无写权限（Permission denied）。
      - app-data:/app/data
    networks:
      - mysql_default
      - redis_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8445/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 复用宿主机上已存在的网络（external: true = 不新建，直接用已有的）
networks:
  mysql_default:
    external: true
  redis_default:
    external: true

volumes:
  # 图片数据卷（实际名称 = 项目目录名_app-data，可用 docker volume ls 查看）
  # 备份示例：docker run --rm -v <实际卷名>:/data -v ${PWD}:/backup alpine tar czf /backup/upload.tar.gz -C /data .
  app-data:
