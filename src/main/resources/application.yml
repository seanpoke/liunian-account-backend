server:
  port: ${SERVER_PORT:8445}
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true

spring:
  sql:
    init:
      # 关闭启动自动执行 SQL：建表由人工手动执行 ci/schema.sql 完成
      mode: never
  servlet:
    multipart:
      # 记账凭证图上传（与 app.upload.max-size-mb 保持一致）
      max-file-size: 5MB
      max-request-size: 15MB
  datasource:
    # ⚠️ 环境隔离：开发/测试一律连 liunian_account_dev；liunian_account 是生产库（已有真实用户），
    #    任何本地启动、冒烟、脚本都不得连接。DatabaseGuard 会在启动时校验实际库名并阻止误连。
    # 时区三重保障：
    # 1) connectionTimezone=+08:00（URL 中 + 必须转义为 %2B）——驱动按东八区解释 Timestamp；
    # 2) forceConnectionTimeZoneToSession=true——把会话 time_zone 也置为 +08:00，
    #    用偏移量而非 Asia/Shanghai，可避开 MySQL 未加载时区表导致连接失败；
    # 3) 业务时间一律由 TimeSupport（app.time-zone）产生，不依赖数据库 NOW()。
    # 注意：不再使用 createDatabaseIfNotExist —— 库不存在时应「快速失败」，
    # 避免驱动静默落到 root 默认 schema（历史上曾因此污染其他项目库）。
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:liunian_account_dev}?useUnicode=true&characterEncoding=UTF-8&connectionTimezone=%2B08%3A00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 借用连接时校验当前库是否正确（schema 正确返回 1 行，错误直接报错 -> 坏连接丢弃重建）
      connection-test-query: SELECT COUNT(*) FROM reminder_setting
      minimum-idle: 2
      maximum-pool-size: 10
      max-lifetime: 300000
      keepalive-time: 60000
      validation-timeout: 3000
      idle-timeout: 120000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 2
          # 定期驱逐/保活空闲连接，避免远端 Redis 空闲被中间设备断开后首次借用 500
          time-between-eviction-runs: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: none
      logic-delete-field: deleted
  type-aliases-package: com.liunian.account.entity
  mapper-locations: classpath*:/mapper/*.xml

jwt:
  secret: ${JWT_SECRET:change-me-please}
  expire-hours: 168

wx:
  appid: ${WX_APPID:}
  secret: ${WX_SECRET:}
  mock: ${WX_MOCK:false}
  invite-page: ${WX_INVITE_PAGE:pages/invite/invite}
  msg-tmpl-id: ${WX_MSG_TMPL_ID:}
  env-version: ${WX_ENV_VERSION:release}

invite:
  max-members: 10
  # 邀请有效期 24 小时；创建时优先复用「未过期且剩余有效期 >= renew-threshold-hours」的邀请
  expire-hours: 24
  renew-threshold-hours: 6

# 全局业务时区（JVM 默认时区 + TimeSupport 同时生效，cron 也引用它）
app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  db:
    # 启动后校验实际连接的库名，不一致直接拒绝启动（防止误连生产库 liunian_account）
    expected: ${MYSQL_DB:liunian_account_dev}
    # 是否允许连接生产库；开发/测试保持 false，生产部署需显式设置 DB_ALLOW_PROD=true
    allow-prod: ${DB_ALLOW_PROD:false}
  # 对外访问基地址，用于拼接图片 fullUrl（留空则返回相对路径）
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  upload:
    # 图片落盘根目录，容器部署时需挂载数据卷（./data:/app/data）
    dir: ${UPLOAD_DIR:./data/upload}
    public-prefix: ${UPLOAD_PUBLIC_PREFIX:/api/files}
    max-size-mb: 5

reminder:
  cron: "0 * * * * ?"
